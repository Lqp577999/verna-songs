  <script>
    const PAGE_SIZE=10;let songs=[],filtered=[],page=1;
    const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows.slice(1).map(r=>({id:r[0]||'',title:r[1]||'',artist:r[2]||'',language:r[3]||'',genre:r[4]||'',type:r[5]||'免费'}))}
    function closeFilters(except=null){document.querySelectorAll('.select-box.open').forEach(box=>{if(box!==except){box.classList.remove('open');box.querySelector('.filter-trigger').setAttribute('aria-expanded','false')}})}
    function addOptions(id,values){const input=$(id),box=input.closest('.select-box'),menu=box.querySelector('.filter-menu'),placeholder=box.dataset.placeholder,items=['',...[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'))];menu.innerHTML=items.map((v,i)=>`<button type="button" class="filter-option${i===0?' selected':''}" role="option" aria-selected="${i===0}" data-value="${esc(v)}">${esc(v||placeholder)}</button>`).join('');menu.querySelectorAll('.filter-option').forEach(option=>option.onclick=e=>{e.stopPropagation();input.value=option.dataset.value;box.querySelector('.filter-value').textContent=option.textContent;menu.querySelectorAll('.filter-option').forEach(item=>{const active=item===option;item.classList.toggle('selected',active);item.setAttribute('aria-selected',String(active))});box.classList.remove('open');box.querySelector('.filter-trigger').setAttribute('aria-expanded','false');input.dispatchEvent(new Event('change',{bubbles:true}))})}
    function apply(reset=true){const q=$('#query').value.trim().toLocaleLowerCase('zh-CN'),l=$('#language').value,g=$('#genre').value,t=$('#type').value;filtered=songs.filter(s=>(!q||[s.id,s.title,s.artist].join(' ').toLocaleLowerCase('zh-CN').includes(q))&&(!l||s.language===l)&&(!g||s.genre===g)&&(!t||s.type===t));if(reset)page=1;render()}
    function render(){const total=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));page=Math.max(1,Math.min(page,total));const items=filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE),rows=$('#rows');rows.classList.remove('reveal');rows.innerHTML=items.length?items.map((s,i)=>`<tr style="--i:${i}"><td class="number">${esc(s.id)}</td><td class="title">${esc(s.title)}</td><td>${esc(s.artist)||'<span class="muted">待补充</span>'}</td><td>${esc(s.language)||'—'}</td><td>${esc(s.genre)||'—'}</td><td><span class="tag ${s.type==='SC'?'sc':s.type==='舰限'?'ship':'free'}">${esc(s.type)}</span></td><td><button class="copy" data-id="${esc(s.id)}">复制点歌</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">没有符合条件的歌曲，请调整搜索或筛选。</td></tr>';requestAnimationFrame(()=>rows.classList.add('reveal'));document.querySelectorAll('.copy').forEach(b=>b.onclick=()=>copySong(songs.find(s=>s.id===b.dataset.id),b));renderPages(total);$('#pageMeta').textContent=`找到 ${filtered.length} 首 · 第 ${page}/${total} 页`;$('#jump').value=page}
    function goToPage(next){const target=Number(next)||1;document.documentElement.style.setProperty('--page-shift',target>page?'18px':target<page?'-18px':'0px');page=target;render()}
    function renderPages(total){const visible=[];for(let p=1;p<=total;p++)if(p===1||p===total||Math.abs(p-page)<=1)visible.push(p);let last=0,html=`<button class="page-btn" data-p="${page-1}" ${page===1?'disabled':''}>‹</button>`;visible.forEach(p=>{if(last&&p-last>1)html+='<span>…</span>';html+=`<button class="page-btn ${p===page?'active':''}" data-p="${p}">${p}</button>`;last=p});html+=`<button class="page-btn" data-p="${page+1}" ${page===total?'disabled':''}>›</button>`;$('#pages').innerHTML=html;document.querySelectorAll('.page-btn:not(:disabled)').forEach(b=>b.onclick=()=>goToPage(b.dataset.p))}
    async function copySong(s,button){if(!s)return;const text=s.artist?`点歌 ${s.title}（${s.artist}）`:`点歌 ${s.title}`;try{await navigator.clipboard.writeText(text)}catch{const x=document.createElement('textarea');x.value=text;document.body.append(x);x.select();document.execCommand('copy');x.remove()}if(button){button.classList.add('copied');button.textContent='已复制 ✓';setTimeout(()=>{button.classList.remove('copied');button.textContent='复制点歌'},1500)}showToast(`已复制：${text}`)}
    function showToast(text){const t=$('#toast');t.querySelector('.toast-message').textContent=text;t.classList.remove('show');requestAnimationFrame(()=>t.classList.add('show'));clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
    function makeSoundline(){const box=document.querySelector('.soundline');for(let i=0;i<72;i++){const bar=document.createElement('i');bar.style.setProperty('--h',`${8+Math.random()*38}px`);bar.style.setProperty('--d',`${-Math.random()*1.8}s`);bar.style.setProperty('--speed',`${1.2+Math.random()*1.2}s`);box.append(bar)}}
    document.querySelectorAll('.filter-trigger').forEach(trigger=>trigger.onclick=e=>{e.stopPropagation();const box=trigger.closest('.select-box'),opening=!box.classList.contains('open');closeFilters(box);box.classList.toggle('open',opening);trigger.setAttribute('aria-expanded',String(opening))});document.addEventListener('click',()=>closeFilters());document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeFilters();document.activeElement?.blur()}});['#query','#language','#genre','#type'].forEach(id=>$(id).addEventListener(id==='#query'?'input':'change',e=>{if(id!=='#query'){const box=e.target.closest('.select-box');box.classList.remove('changed');requestAnimationFrame(()=>box.classList.add('changed'));setTimeout(()=>box.classList.remove('changed'),430)}apply(true)}));$('#random').onclick=()=>{if(!filtered.length)return showToast('当前条件下没有歌曲');const button=$('#random');button.classList.add('is-picking');button.textContent='正在抽选…';setTimeout(()=>{const picked=filtered[Math.floor(Math.random()*filtered.length)];button.classList.remove('is-picking');button.textContent='随机选一首';const notice=$('#notice');notice.textContent=`随机抽中：${picked.title}${picked.artist?`（${picked.artist}）`:''}`;notice.classList.remove('flash');requestAnimationFrame(()=>notice.classList.add('flash'));copySong(picked)},520)};$('#go').onclick=()=>{page=Number($('#jump').value)||1;render()};$('#jump').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};makeSoundline();
    function loadSongs(items){songs=items;filtered=[...songs];const count=$('#totalCount');count.textContent=songs.length;count.classList.add('bump');setTimeout(()=>count.classList.remove('bump'),500);addOptions('#language',songs.map(s=>s.language));addOptions('#genre',songs.map(s=>s.genre));addOptions('#type',songs.map(s=>s.type));render()}
    fetch('songs.csv?v=20260730-631',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()}).then(text=>loadSongs(parseCSV(text.replace(/^\uFEFF/,'')))).catch(()=>{if(Array.isArray(window.VERNA_SONGS)&&window.VERNA_SONGS.length)loadSongs(window.VERNA_SONGS);else{$('#rows').innerHTML='<tr><td colspan="7" class="empty">歌单载入失败，请确认 songs.csv 与网页位于同一文件夹。</td></tr>';$('#totalCount').textContent='0'}})
  </script>
</body>
</html>
